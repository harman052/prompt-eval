name: Prompt Eval

on:
  pull_request:
    paths:
      - "prompts/**"
      - "data/dataset.json"
      - "src/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      MAX_TOKENS: ${{ vars.MAX_TOKENS }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Generate outputs
        run: uv run prompt-eval generate --dataset data/dataset.json

      - name: Evaluate
        run: uv run prompt-eval evaluate --fail-under 7.0

      - name: Compare against baseline
        run: uv run prompt-eval compare --regression-threshold 1.0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval_results/
            comparison_results/
